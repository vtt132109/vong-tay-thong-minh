name: CI

on:
  push:
  pull_request:

jobs:
  firmware:
    name: Build firmware (PlatformIO)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/cache@v4
        with:
          path: |
            ~/.platformio
            .pio
          key: pio-${{ hashFiles('platformio.ini') }}
      - run: pip install platformio
      # include/secrets.h is gitignored: the build falls back to the setup-AP path.
      - run: pio run -e esp32-s3-super-mini

  python-tests:
    name: Python tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: |
          pip install numpy scipy pytest pyserial scikit-learn
          pip install torch --index-url https://download.pytorch.org/whl/cpu
      - run: python -m pytest tests -q
