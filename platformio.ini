[env:esp32-s3-super-mini]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200
; ESP32-S3 Super Mini (ESP32-S3FH4R2: 4 MB flash, 2 MB PSRAM) has no native board id.
; Keep the DevKitC-1 variant and override flash/partition for 4 MB.
board_upload.flash_size = 4MB
board_build.partitions = default.csv
board_build.embed_txtfiles =
    realtime.html
build_flags =
    -DARDUINO_USB_CDC_ON_BOOT=1
    ; Set to 1 after adding the Edge Impulse exported library to lib/.
    -DENABLE_EDGE_AI=0
lib_deps = 
    adafruit/Adafruit SSD1306@^2.5.9
    adafruit/Adafruit GFX Library@^1.11.9
    adafruit/Adafruit MPU6050@^2.2.6
    bblanchon/ArduinoJson@^6.21.5
    https://github.com/oxullo/Arduino-MAX30100.git

